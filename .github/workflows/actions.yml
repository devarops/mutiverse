name: Tests
on:
  push:
    branches: [develop]
jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
    - name: Copia repositorio
      uses: actions/checkout@v2
    - name: Construye imagen
      run: docker build --tag mutiverse .
    - name: Verifica el formato
      run: docker run mutiverse make check
    - name: Corre pruebas
      run: docker run mutiverse make tests
